<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEON CORE HUB</title>

<style>

/* GLOBAL */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(circle at top,#101820,#050505 60%);

    color:white;

    font-family:Arial, sans-serif;

    overflow:hidden;

    width:100%;
    height:100vh;
}

/* MAIN SCREEN */

#home{

    width:100%;
    height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}

/* TITLE */

.title{

    font-size:34px;

    font-weight:bold;

    margin-bottom:50px;

    letter-spacing:6px;

    color:#00f7ff;

    text-shadow:
    0 0 10px #00f7ff,
    0 0 25px #00f7ff;
}

/* GRID */

.grid{

    display:grid;

    grid-template-columns:repeat(2,150px);

    gap:25px;
}

/* APP CARDS */

.card{

    height:150px;

    border-radius:20px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    color:white;

    font-size:18px;

    font-weight:bold;

    transition:0.25s;

    cursor:pointer;

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.1);

    box-shadow:
    0 0 20px rgba(255,255,255,0.08);
}

/* HOVER */

.card:hover{

    transform:scale(1.05);

    box-shadow:
    0 0 25px rgba(255,255,255,0.25);
}

/* ICONS */

.icon{

    font-size:42px;

    margin-bottom:15px;
}

/* CARD COLORS */

.youtube{
    background:linear-gradient(135deg,#ff0000,#700000);
}

.browser{
    background:linear-gradient(135deg,#00c6ff,#0047ff);
}

.music{
    background:linear-gradient(135deg,#1db954,#003b12);
}

.ai{
    background:linear-gradient(135deg,#9b59ff,#3d0070);
}

/* WEBVIEW */

#viewer{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    border:none;

    display:none;

    z-index:999;
}

/* TOP BAR */

#topbar{

    position:fixed;

    top:0;
    left:0;

    width:100%;

    height:60px;

    background:rgba(0,0,0,0.8);

    backdrop-filter:blur(10px);

    display:none;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    z-index:1000;

    border-bottom:1px solid rgba(255,255,255,0.1);
}

/* BACK BUTTON */

.back{

    background:#111;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;
}

.back:hover{
    background:#222;
}

/* LABEL */

.label{

    color:#00f7ff;

    font-weight:bold;

    letter-spacing:2px;
}

</style>
</head>

<body>

<!-- HOME -->

<div id="home">

    <div class="title">
        NEON CORE
    </div>

    <div class="grid">

        <div class="card youtube"
            onclick="openSite('https://www.youtube.com/embed/jNQXAC9IVRw')">

            <div class="icon">▶</div>

            YouTube
        </div>

        <div class="card browser"
            onclick="openSite('https://example.com')">

            <div class="icon">🌐</div>

            Browser
        </div>

        <div class="card music"
            onclick="openSite('https://open.spotify.com/embed/track/11dFghVXANMlKmJXsNCbNl')">

            <div class="icon">♫</div>

            Music
        </div>

        <div class="card ai"
            onclick="openSite('https://example.com')">

            <div class="icon">◎</div>

            AI
        </div>

    </div>

</div>

<!-- TOPBAR -->

<div id="topbar">

    <button class="back"
        onclick="goBack()">
        ← BACK
    </button>

    <div class="label">
        NEON SESSION
    </div>

</div>

<!-- VIEWER -->

<iframe id="viewer"></iframe>

<script>

const viewer =
document.getElementById("viewer");

const home =
document.getElementById("home");

const topbar =
document.getElementById("topbar");

/* OPEN */

function openSite(url){

    viewer.style.display="block";

    topbar.style.display="flex";

    home.style.display="none";

    viewer.src=url;
}

/* BACK */

function goBack(){

    viewer.src="";

    viewer.style.display="none";

    topbar.style.display="none";

    home.style.display="flex";
}

</script>

</body>
</html>
