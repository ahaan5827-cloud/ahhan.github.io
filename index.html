<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTEM HUB</title>

<meta name="theme-color" content="#050505">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: radial-gradient(circle at top,#0f2027,#050505 70%);
    color:#00ffcc;
    font-family:"Courier New", monospace;

    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* HUB */
.hub{
    width:340px;
    padding:30px;

    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(12px);

    border:1px solid rgba(0,255,204,0.2);
    border-radius:20px;

    text-align:center;
}

/* TITLE */
.title{
    font-size:28px;
    letter-spacing:5px;
    margin-bottom:10px;
    text-shadow:0 0 10px #00ffcc;
}

.sub{
    font-size:11px;
    color:#888;
    margin-bottom:25px;
}

/* BUTTONS */
.btn{
    display:block;
    padding:16px;
    margin:12px 0;

    border-radius:12px;

    text-decoration:none;
    font-size:16px;
    font-weight:bold;

    border:2px solid;

    transition:0.2s;
}

/* HOVER */
.btn:hover{
    transform:scale(1.03);
}

/* X */
.x{
    background:linear-gradient(135deg,#111,#222);
    color:#fff;
    border-color:#fff;
}

/* YOUTUBE */
.yt{
    background:linear-gradient(135deg,#3a0000,#7a0000);
    color:#ff4b4b;
    border-color:#ff4b4b;
}

/* NOTE */
.note{
    margin-top:15px;
    font-size:10px;
    color:#777;
}

</style>
</head>

<body>

<div class="hub">

    <div class="title">SYSTEM HUB</div>
    <div class="sub">SAFE LAUNCH MODE</div>

    <!-- IMPORTANT FIX: NO WebView navigation -->
    <a class="btn x" href="https://x.com" target="_system">
        OPEN X (SAFE MODE)
    </a>

    <a class="btn yt" href="https://www.youtube.com" target="_system">
        OPEN YOUTUBE (SAFE MODE)
    </a>

    <div class="note">
        This mode prevents login loops by opening apps in system browser or native apps.
    </div>

</div>

<script>

/*
KEY FIX:
We DO NOT force internal WebView navigation anymore.

Instead, we allow Android system to handle it properly.
This stops login loops.
*/

document.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", function(){
        // allow system to handle intent correctly
        return true;
    });
});

</script>

</body>
</html>
