<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTEM HUB</title>

<meta name="theme-color" content="#050505">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: radial-gradient(circle at top,#0f2027,#050505 70%);
    color:#00ffcc;
    font-family:"Courier New", monospace;

    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

/* PANEL */
.hub{
    width:340px;
    padding:30px 25px;

    border-radius:20px;

    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);

    border:1px solid rgba(0,255,204,0.2);

    text-align:center;
}

/* TITLE */
.title{
    font-size:28px;
    letter-spacing:5px;
    margin-bottom:8px;

    color:#00ffcc;
    text-shadow:0 0 10px #00ffcc;
}

.sub{
    font-size:11px;
    color:#888;
    margin-bottom:25px;
}

/* BUTTONS */
.btn{
    display:block;

    padding:16px;
    margin:12px 0;

    border-radius:12px;

    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    letter-spacing:2px;

    border:2px solid;

    transition:0.2s;

    user-select:none;
}

/* HOVER */
.btn:hover{
    transform:scale(1.03);
}

/* X */
.x{
    background:linear-gradient(135deg,#111,#222);
    border-color:#ffffff;
    color:#ffffff;
}

/* YOUTUBE */
.yt{
    background:linear-gradient(135deg,#3a0000,#7a0000);
    border-color:#ff4b4b;
    color:#ff4b4b;
}

/* FOOTER */
.footer{
    margin-top:18px;
    font-size:10px;
    color:#666;
}

</style>
</head>

<body>

<div class="hub">

    <div class="title">SYSTEM HUB</div>
    <div class="sub">ACCESS TERMINAL</div>

    <!-- LINKS -->
    <a class="btn x" href="https://x.com">INITIALIZE X</a>

    <a class="btn yt" href="https://www.youtube.com">INITIALIZE YOUTUBE</a>

    <div class="footer">
        NOTE: Some apps may still open externally due to Android system rules
    </div>

</div>

<script>

/*
Best possible JS control (WebView friendly)
This prevents new tab behavior inside normal browsers.
NOT guaranteed against Android intent system.
*/

document.addEventListener("click", function(e){

    const a = e.target.closest("a");

    if(a){

        e.preventDefault();

        window.location.href = a.href;

    }

});

</script>

</body>
</html>
