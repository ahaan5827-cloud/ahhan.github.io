<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTEM HUB</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:#00ff00;
    font-family:"Courier New", monospace;

    width:100%;
    height:100vh;

    overflow:hidden;
}

/* HOME SCREEN */

#homeScreen{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;
}

.header{
    font-size:28px;
    letter-spacing:4px;

    margin-bottom:45px;

    border-bottom:1px solid #00ff00;

    padding-bottom:12px;

    text-shadow:0 0 10px #00ff00;
}

.launch-btn{

    width:260px;

    padding:18px;

    margin:15px;

    background:#111;

    color:#00ff00;

    border:2px solid #00ff00;

    font-size:18px;

    letter-spacing:2px;

    text-transform:uppercase;

    border-radius:8px;

    cursor:pointer;

    transition:0.25s;

    box-shadow:0 0 12px rgba(0,255,0,0.25);
}

.launch-btn:hover{
    transform:scale(1.03);

    box-shadow:0 0 18px rgba(0,255,0,0.5);
}

.launch-btn:active{
    background:#00ff00;
    color:#000;
}

/* YOUTUBE BUTTON */

.youtube-btn{
    color:#ff3333;

    border-color:#ff3333;

    box-shadow:0 0 12px rgba(255,51,51,0.25);
}

.youtube-btn:hover{
    box-shadow:0 0 18px rgba(255,51,51,0.5);
}

.youtube-btn:active{
    background:#ff3333;
    color:#000;
}

/* APP VIEWER */

#appFrame{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    border:none;

    display:none;

    background:#000;

    z-index:999;
}

/* TOP BAR */

#topBar{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:50px;

    background:#000;

    display:none;

    align-items:center;

    padding-left:10px;

    z-index:1000;

    border-bottom:1px solid #00ff00;
}

.back-btn{

    background:#111;

    color:#00ff00;

    border:1px solid #00ff00;

    padding:8px 16px;

    cursor:pointer;

    font-family:inherit;

    border-radius:5px;
}

.back-btn:active{
    background:#00ff00;
    color:#000;
}

</style>
</head>

<body>

<!-- HOME SCREEN -->

<div id="homeScreen">

    <div class="header">
        SYS // TERMINAL_HUB
    </div>

    <button class="launch-btn"
        onclick="openSite('https://example.com')">
        Initialize Browser
    </button>

    <button class="launch-btn youtube-btn"
        onclick="openSite('https://www.youtube.com/embed/dQw4w9WgXcQ')">
        Initialize YouTube
    </button>

</div>

<!-- TOP BAR -->

<div id="topBar">

    <button class="back-btn" onclick="goHome()">
        BACK
    </button>

</div>

<!-- APP VIEWER -->

<iframe id="appFrame"></iframe>

<script>

const frame = document.getElementById("appFrame");

const home = document.getElementById("homeScreen");

const topBar = document.getElementById("topBar");

/* OPEN SITE */

function openSite(url){

    frame.style.display = "block";

    topBar.style.display = "flex";

    home.style.display = "none";

    frame.src = url;
}

/* GO HOME */

function goHome(){

    frame.style.display = "none";

    topBar.style.display = "none";

    home.style.display = "flex";

    frame.src = "";
}

</script>

</body>
</html>
