<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM HUB</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }
        .header {
            font-size: 24px;
            margin-bottom: 40px;
            letter-spacing: 4px;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 10px;
        }
        .launch-btn {
            background-color: #111;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 15px 40px;
            margin: 15px;
            text-decoration: none;
            font-size: 18px;
            letter-spacing: 2px;
            width: 250px;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        .launch-btn:active {
            background-color: #00ff00;
            color: #000;
        }
        .youtube-btn {
            color: #ff3333;
            border-color: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.2);
        }
        .youtube-btn:active {
            background-color: #ff3333;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="header">SYS // TERMINAL_HUB</div>
    
    <!-- Stripped Intent Links: No javascript, no fallbacks -->
    <a href="intent://x.com/#Intent;scheme=https;package=com.twitter.android;end;" class="launch-btn">Initialize X</a>
    <a href="intent://www.youtube.com/#Intent;scheme=https;package=com.google.android.youtube;end;" class="launch-btn youtube-btn">Initialize YouTube</a>

    <script>
        // Keep ONLY the Service Worker so it installs as an app
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
