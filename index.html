<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEON SYSTEM HUB</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(circle at top,#101820,#050505 70%);

    color:white;

    font-family:Arial, sans-serif;

    width:100%;
    height:100vh;

    overflow:hidden;
}

/* HOME SCREEN */

#home{

    width:100%;
    height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}

/* TITLE */

.title{

    font-size:34px;

    font-weight:bold;

    letter-spacing:5px;

    margin-bottom:50px;

    color:#00f7ff;

    text-shadow:
    0 0 10px #00f7ff,
    0 0 25px #00f7ff;
}

/* GRID */

.grid{

    display:grid;

    grid-template-columns:repeat(2,160px);

    gap:25px;
}

/* CARDS */

.card{

    height:160px;

    border-radius:22px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    transition:0.25s;

    font-weight:bold;

    font-size:18px;

    text-align:center;

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,0.1);

    box-shadow:
    0 0 25px rgba(255,255,255,0.08);
}

/* HOVER */

.card:hover{

    transform:scale(1.05);

    box-shadow:
    0 0 25px rgba(255,255,255,0.25);
}

/* ICON */

.icon{

    font-size:42px;

    margin-bottom:15px;
}

/* SITE COLORS */

.xcard{

    background:
    linear-gradient(135deg,#111,#333);
}

.ytcard{

    background:
    linear-gradient(135deg,#ff0000,#6e0000);
}

/* WEB VIEW */

#viewer{

    position:fixed;

    top:60px;
    left:0;

    width:100%;
    height:calc(100% - 60px);

    border:none;

    display:none;

    background:#000;

    z-index:999;
}

/* TOP BAR */

#topbar{

    position:fixed;

    top:0;
    left:0;

    width:100%;

    height:60px;

    background:rgba(0,0,0,0.85);

    backdrop-filter:blur(10px);

    display:none;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    z-index:1000;

    border-bottom:
    1px solid rgba(255,255,255,0.1);
}

/* BACK BUTTON */

.back{

    background:#111;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;
}

.back:hover{

    background:#222;
}

/* LABEL */

.label{

    color:#00f7ff;

    font-weight:bold;

    letter-spacing:2px;
}

.note{

    position:fixed;

    bottom:12px;

    width:100%;

    text-align:center;

    font-size:12px;

    color:#888;
}

</style>
</head>

<body>

<!-- HOME -->

<div id="home">

    <div class="title">
        NEON SYSTEM HUB
    </div>

    <div class="grid">

        <!-- X -->

        <div class="card xcard"
            onclick="openExternal('https://x.com')">

            <div class="icon">𝕏</div>

            X PLATFORM
        </div>

        <!-- YOUTUBE -->

        <div class="card ytcard"
            onclick="openExternal('https://youtube.com')">

            <div class="icon">▶</div>

            YOUTUBE
        </div>

    </div>

</div>

<!-- TOP BAR -->

<div id="topbar">

    <button class="back"
        onclick="goHome()">
        ← BACK
    </button>

    <div class="label">
        LIVE SESSION
    </div>

</div>

<!-- IFRAME -->

<iframe id="viewer"></iframe>

<div class="note">
    Some websites may still open externally due to browser security restrictions.
</div>

<script>

const viewer =
document.getElementById("viewer");

const home =
document.getElementById("home");

const topbar =
document.getElementById("topbar");

/* OPEN */

function openExternal(url){

    /*
    ATTEMPT iframe first
    */

    viewer.style.display="block";

    topbar.style.display="flex";

    home.style.display="none";

    viewer.src=url;

    /*
    fallback:
    some sites force external opening
    */
}

/* BACK */

function goHome(){

    viewer.src="";

    viewer.style.display="none";

    topbar.style.display="none";

    home.style.display="flex";
}

</script>

</body>
</html>
