<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>SYSTEM HUB</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Android Theme -->
    <meta name="theme-color" content="#050505">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #00ff00;
            font-family: "Courier New", monospace;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 100vh;

            text-transform: uppercase;
        }

        .header {
            font-size: 26px;
            letter-spacing: 5px;

            margin-bottom: 45px;

            border-bottom: 1px solid #00ff00;
            padding-bottom: 12px;

            text-shadow: 0 0 8px #00ff00;
        }

        .launch-btn {
            background: #111;
            color: #00ff00;

            border: 2px solid #00ff00;

            padding: 16px 40px;
            margin: 14px;

            width: 260px;

            text-align: center;
            text-decoration: none;

            font-size: 18px;
            letter-spacing: 2px;

            transition: 0.25s ease;

            box-shadow: 0 0 12px rgba(0,255,0,0.2);

            border-radius: 8px;
        }

        .launch-btn:hover {
            transform: scale(1.03);

            box-shadow: 0 0 18px rgba(0,255,0,0.5);
        }

        .launch-btn:active {
            background: #00ff00;
            color: #000;
        }

        .youtube-btn {
            color: #ff3333;
            border-color: #ff3333;

            box-shadow: 0 0 12px rgba(255,51,51,0.2);
        }

        .youtube-btn:hover {
            box-shadow: 0 0 18px rgba(255,51,51,0.5);
        }

        .youtube-btn:active {
            background: #ff3333;
            color: #000;
        }
    </style>
</head>

<body>

    <div class="header">
        SYS // TERMINAL_HUB
    </div>

    <!-- SAME WINDOW OPENING -->
    <a href="https://x.com" class="launch-btn">
        Initialize X
    </a>

    <a href="https://www.youtube.com" class="launch-btn youtube-btn">
        Initialize YouTube
    </a>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

</body>
</html>
