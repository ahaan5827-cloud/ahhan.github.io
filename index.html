<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTEM HUB</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050505">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: radial-gradient(circle at top,#0f2027,#050505 70%);
    color:#00ff99;
    font-family:"Courier New", monospace;

    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* PANEL */
.hub{
    width:340px;
    padding:35px 25px;
    border-radius:22px;

    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);

    border: 1px solid rgba(0,255,153,0.2);

    text-align:center;
}

/* TITLE */
.header{
    font-size:28px;
    letter-spacing:5px;
    margin-bottom:10px;
    color:#00ffcc;
    text-shadow:0 0 10px #00ffcc;
}

.sub{
    font-size:12px;
    color:#888;
    margin-bottom:30px;
}

/* BUTTONS */
.launch-btn{
    display:block;
    padding:16px;
    margin:12px 0;

    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    letter-spacing:2px;

    border-radius:12px;

    border:2px solid;

    transition:0.2s;

    color:white;
}

/* HOVER */
.launch-btn:hover{
    transform:scale(1.03);
}

/* X */
.x-btn{
    background:linear-gradient(135deg,#111,#222);
    border-color:#fff;
}

/* YOUTUBE */
.youtube-btn{
    background:linear-gradient(135deg,#3a0000,#8b0000);
    border-color:#ff4b4b;
}

/* FOOTER */
.footer{
    margin-top:20px;
    font-size:11px;
    color:#666;
}

</style>
</head>

<body>

<div class="hub">

    <div class="header">SYSTEM HUB</div>
    <div class="sub">TERMINAL ACCESS PANEL</div>

    <!-- X -->
    <a href="https://x.com" class="launch-btn x-btn">
        INITIALIZE X
    </a>

    <!-- YOUTUBE -->
    <a href="https://www.youtube.com" class="launch-btn youtube-btn">
        INITIALIZE YOUTUBE
    </a>

    <div class="footer">
        SECURE SESSION ACTIVE
    </div>

</div>

<script>
// Force same-window navigation inside WebView
document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", function(e){
        e.preventDefault();
        window.location.href = this.href;
    });
});
</script>

</body>
</html>
